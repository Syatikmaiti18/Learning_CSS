<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative_property: em</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            font-size: 50px;
        }
        #first{
            height: 200px;
            width: 200px;
            background-color: red;
            color: white;
            font-size: 15px;
        }
        #second{
            height: 50%;
            width: 50%;
            background-color: blue;
            font-size: 2em;
        }

    </style>
</head>
<body>
    Body
    <div id="first">
        First div
        <div id="second">
            Second div
        </div>
    </div>

</body>
</html>
