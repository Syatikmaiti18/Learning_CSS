<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative_property: rem</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-size: 50px;
        }

        #first{
            height: 100px;
            width: 200px;
            background-color: red;
            color: white;
            font-size: 25px;
        }
        #second{
            height: 60%;
            width: 50%;
            background-color: blue;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    Body
    <div id="first">
        first div
        <div id="second">
            second div
        </div>
    </div>
</body>
</html>
