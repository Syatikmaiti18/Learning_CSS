<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Id Selector</title>
    <style>
        #first{
            color: orange;
        }
        #second{
            color: green;
        }
    </style>
</head>
<body>
    <div id="first"><b>first line</b></div>
    <div id="second"><b>second line</b></div>
</body>
</html>
