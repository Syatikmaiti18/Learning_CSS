<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class selector</title>
    <style>
        .first{
            color: coral;
        }
        .second{
            color: blue;
        }
    </style>
</head>
<body>
    <div class="first"><b>This is first class</b></div>
    <div class="second"><b>This is second class</b></div>
    <div class="second"><h1>This is also second class</h1></div>
</body>
</html>
