<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo classes</title>
    <style>
        .pseudo{
            height: 25px;
            width: 150px;
            background-color: lightyellow;
            border: 2px solid black;
            border-radius: 10px;

            transition: all;
            transition-duration: 4s;
            transition-timing-function: ease-in-out;
            transition-delay: 1s;
        }
        .pseudo:hover{
            background-color: mediumseagreen;
            height: 35px;
            width: 160px;
        }
        .pseudo:active{
            height: 40px;
            width: 170px;
            background-color: red;
        }
    </style>
</head>
<body>
    <button class="pseudo">Learning Pseudo</button>
</body>
</html>
