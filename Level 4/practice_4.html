<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice of level 3</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .div{
            height: 100px;
            width: 100px;
            padding: 10px;
            margin: 20px;
        }
        #first{
            background-color: aqua;
            box-sizing: content-box;
        }
        #second{
            background-color: slateblue;
            box-sizing: border-box;
        }
        button{
            height: 70px;
            width: 70px;
            padding: 10px 15px 10px 15px;
            margin: 100px;
            border: 2px dotted red;
            border-radius: 35px;
        }
    </style>
</head>
<body>
    <div id="first" class="div">first</div>
    <div id="second" class="div">second</div>
    <button>click here</button>
</body>
</html>
