<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text_Transform</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            background-color: aquamarine;
        }
        #box1{
            text-transform: uppercase;
        }
        #box2{
            text-transform: lowercase;
        }
        #box3{
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <div id="box1" class="box">hello guys DO SOme BhanGRA</div><br>
    <div id="box2" class="box">hello guys DO SOme BhanGRA</div><br>
    <div id="box3" class="box">hello guys DO SOme bhanGRA</div><br>
</body>
</html>
