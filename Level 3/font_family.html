<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Family</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <style>
        #first{
            font-family: 'Courier New', Courier, monospace;
        }
        #second{
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        #third{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        #fourth{
            font-family: "Dancing Script", cursive;
        }
    </style>
</head>
<body>
    <p id="first">Lorem ipsum dolor sit amet consectetur adipisicing elit. Reiciendis, hic?</p>
    <p id="second">Lorem ipsum dolor sit amet consectetur adipisicing elit. Eaque, beatae?</p>
    <p id="third">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad, quo.</p>
    <p id="fourth">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Eveniet, voluptate!</p>
</body>
</html>
