<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text decoration</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            background-color: yellowgreen;
        }
        #box1{
           
            text-align: center;
            text-decoration: underline;
        }
        #box2{
            text-align: right;
            text-decoration: line-through;
            text-decoration-color: turquoise ;
        }
        #box3{
            text-align: justify;
            text-decoration: overline;
        }
        #box4{
            text-decoration: underline;
            text-decoration-style: dotted;
        }
        #box5{
            text-decoration: line-through;
            text-decoration-style: dotted;
        }
        #box6{
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: red;
        }
        #box7{
            text-decoration: line-through;
            text-decoration-style: double;
            text-decoration-color: pink ;
        }
        /* a{
            text-decoration: none;
        } */
    </style>
</head>
<body>
    <div id="box1" class="box">BOX 1</div><br>
    <div id="box2" class="box">BOX 2</div><br>
    <div id="box3" class="box">BOX 3</div><br>
    <div id="box4" class="box">BOX 4</div><br>
    <div id="box5" class="box">BOX 5</div><br>
    <div id="box6" class="box">BOX 6</div><br>
    <div id="box7" class="box">BOX 7</div><br>


    <a href="#" style="text-decoration: none;">click here</a><br>
    <a href="#" style="color: red;">link here</a>

</body>
</html>
